user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # SSL Global Settings
    ssl_certificate      /etc/nginx/ssl/server.crt;
    ssl_certificate_key  /etc/nginx/ssl/server.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # Docker Internal DNS Resolver (Cho phép Nginx khởi động linh hoạt khi container upstreams nạp lại)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # =========================================================================
    # 1. VIONE APP - MẠNG XÃ HỘI DOANH NHÂN VIONE CONNECT HTTPS (Port 5445)
    # TÁCH BIỆT HOÀN TOÀN: Forward to vione-frontend-prod (8080) & vione-backend-prod (4000)
    # =========================================================================
    server {
        listen 5445 ssl;
        server_name 14.225.217.232 localhost dev-vione.14-225-217-232.sslip.io *.sslip.io;
        error_page 497 =301 https://$host:$server_port$request_uri;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /sw.js {
            set $upstream_vione "http://vione-frontend-prod:8080";
            proxy_pass $upstream_vione;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /assets/ {
            set $upstream_vione "http://vione-frontend-prod:8080";
            proxy_pass $upstream_vione;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            set $upstream_vione "http://vione-frontend-prod:8080";
            proxy_pass $upstream_vione;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /api/ {
            set $upstream_vione_api "http://vione-backend-prod:4000";
            proxy_pass $upstream_vione_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /uploads/ {
            set $upstream_vione_uploads "http://vione-backend-prod:4000";
            proxy_pass $upstream_vione_uploads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /upload/ {
            rewrite ^/upload/(.*)$ /api/upload/$1 break;
            set $upstream_vione_upload "http://vione-backend-prod:4000";
            proxy_pass $upstream_vione_upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /socket.io/ {
            set $upstream_vione_ws "http://vione-backend-prod:4000";
            proxy_pass $upstream_vione_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # =========================================================================
    # 2. VIONE CRM - HỆ THỐNG CRM QUẢN TRỊ DOANH NGHIỆP HTTPS (Port 5446)
    # TÁCH BIỆT HOÀN TOÀN: Forward to vione-crm-frontend-prod (8080) & vione-crm-backend-prod (4000)
    # Hỗ trợ Dev Port 5446 HTTPS và Subdomain https://crm_vione.viconnect.vn
    # =========================================================================
    server {
        listen 5446 ssl;
        server_name 14.225.217.232 localhost dev-vione-crm.14-225-217-232.sslip.io crm_vione.viconnect.vn crm-vione.viconnect.vn crm.viconnect.vn *.sslip.io;
        error_page 497 =301 https://$host:$server_port$request_uri;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /sw.js {
            set $upstream_vione_crm "http://vione-crm-frontend-prod:8080";
            proxy_pass $upstream_vione_crm;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /assets/ {
            set $upstream_vione_crm "http://vione-crm-frontend-prod:8080";
            proxy_pass $upstream_vione_crm;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # TÁCH BIỆT HOÀN TOÀN: Cổng 5446 chỉ thuộc về CRM của ViOne.
        # Tuyệt đối không phục vụ PWA /connect-app tại đây, chuyển hướng ngay về subdomain PWA chính thức.
        location /connect-app {
            return 301 https://vione.viconnect.vn/connect-app;
        }

        location / {
            set $upstream_vione_crm "http://vione-crm-frontend-prod:8080";
            proxy_pass $upstream_vione_crm;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /api/ {
            set $upstream_vione_crm_api "http://vione-crm-backend-prod:4000";
            proxy_pass $upstream_vione_crm_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /uploads/ {
            set $upstream_vione_crm_uploads "http://vione-crm-backend-prod:4000";
            proxy_pass $upstream_vione_crm_uploads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /upload/ {
            rewrite ^/upload/(.*)$ /api/upload/$1 break;
            set $upstream_vione_crm_upload "http://vione-crm-backend-prod:4000";
            proxy_pass $upstream_vione_crm_upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /socket.io/ {
            set $upstream_vione_crm_ws "http://vione-crm-backend-prod:4000";
            proxy_pass $upstream_vione_crm_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
