services:
  ssl-reverse-proxy:
    image: nginx:alpine
    container_name: vione-ssl-proxy
    restart: always
    ports:
      - "5445:5445"
      - "5446:5446"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server.crt:/etc/nginx/ssl/server.crt:ro
      - ./server.key:/etc/nginx/ssl/server.key:ro
    networks:
      - vione-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  vione-network:
    external: true
    name: vione-network
