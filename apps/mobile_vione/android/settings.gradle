pluginManagement {
    def directRnPlugin = [
        new File(settingsDir, "../node_modules/@react-native/gradle-plugin"),
        new File(rootDir, "../node_modules/@react-native/gradle-plugin"),
        new File(rootDir, "apps/mobile_vione/node_modules/@react-native/gradle-plugin"),
        new File(rootDir, "node_modules/@react-native/gradle-plugin")
    ].find { it.exists() }

    if (directRnPlugin) {
        includeBuild(directRnPlugin.getCanonicalPath())
    } else {
        includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().toString())
    }
}
plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      'node',
      '--no-warnings',
      '--eval',
      'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ].toList()
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'Vione'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      def directLibsToml = [
          new File(settingsDir, "../node_modules/react-native/gradle/libs.versions.toml"),
          new File(rootDir, "../node_modules/react-native/gradle/libs.versions.toml"),
          new File(rootDir, "apps/mobile_vione/node_modules/react-native/gradle/libs.versions.toml"),
          new File(rootDir, "node_modules/react-native/gradle/libs.versions.toml")
      ].find { it.exists() }
      if (directLibsToml) {
        from(files(directLibsToml.getCanonicalFile()))
      } else {
        from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
      }
    }
  }
}

def directAutolinking = [
    new File(settingsDir, "../node_modules/expo/scripts/autolinking.gradle"),
    new File(rootDir, "../node_modules/expo/scripts/autolinking.gradle"),
    new File(rootDir, "apps/mobile_vione/node_modules/expo/scripts/autolinking.gradle"),
    new File(rootDir, "node_modules/expo/scripts/autolinking.gradle")
].find { it.exists() }
if (directAutolinking) {
  apply from: directAutolinking.getCanonicalFile()
} else {
  apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
}
useExpoModules()

include ':app'
def directRnPluginBottom = [
    new File(settingsDir, "../node_modules/@react-native/gradle-plugin"),
    new File(rootDir, "../node_modules/@react-native/gradle-plugin"),
    new File(rootDir, "apps/mobile_vione/node_modules/@react-native/gradle-plugin"),
    new File(rootDir, "node_modules/@react-native/gradle-plugin")
].find { it.exists() }
if (directRnPluginBottom) {
  includeBuild(directRnPluginBottom.getCanonicalFile())
} else {
  includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())
}
