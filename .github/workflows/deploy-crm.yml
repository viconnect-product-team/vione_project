name: Deploy CRM to Subdomain (crm.viconnect.vn)

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/crm/**'
      - '.github/workflows/deploy-crm.yml'

jobs:
  deploy:
    name: Build & Deploy ViOne CRM (crm.viconnect.vn)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate TanStack Routes
        run: node apps/vione_app_fe/scripts/gen-routes.mjs

      - name: Build Web CRM Frontend
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          export VITE_APP_SCOPE="crm_platform"
          export VITE_APP_NAME="ViOne Connect CRM 5.0"
          export VITE_PUBLIC_APP_URL="https://crm.viconnect.vn"
          export NEST_API_URL="http://vione-crm-backend:4000"
          npm run build --prefix apps/vione_app_fe

      - name: Build Docker Frontend Image
        run: |
          docker build --no-cache -t vione-crm-frontend:latest -f deploy/crm/Dockerfile.frontend .
          docker save vione-crm-frontend:latest | gzip -1 > vione-crm-frontend.tar.gz

      - name: Prepare Remote Directories via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST || '14.225.217.232' }}
          username: ${{ secrets.REMOTE_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            mkdir -p ~/vione-crm ~/ssl-proxy

      - name: Copy Built Artifacts via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST || '14.225.217.232' }}
          username: ${{ secrets.REMOTE_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "vione-crm-frontend.tar.gz,deploy/crm/docker-compose.yml,deploy/crm/.env.production,deploy/ssl/nginx.conf,deploy/ssl/docker-compose.ssl.yml,deploy/ssl/setup-ssl.sh"
          target: "vione_crm_deploy_temp"

      - name: Activate New Container & Reload Nginx Proxy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST || '14.225.217.232' }}
          username: ${{ secrets.REMOTE_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            # Move frontend image & compose
            cp -f ~/vione_crm_deploy_temp/vione-crm-frontend.tar.gz ~/vione-crm/ 2>/dev/null || true
            cp -f ~/vione_crm_deploy_temp/deploy/crm/docker-compose.yml ~/vione-crm/ 2>/dev/null || true
            cp -f ~/vione_crm_deploy_temp/deploy/crm/.env.production ~/vione-crm/.env.crm 2>/dev/null || true
            cp -f ~/vione_crm_deploy_temp/deploy/crm/.env.production ~/vione-crm/.env 2>/dev/null || true
            
            # Move SSL & Nginx config
            cp -f ~/vione_crm_deploy_temp/deploy/ssl/nginx.conf ~/ssl-proxy/ 2>/dev/null || true
            cp -f ~/vione_crm_deploy_temp/deploy/ssl/docker-compose.ssl.yml ~/ssl-proxy/ 2>/dev/null || true
            cp -f ~/vione_crm_deploy_temp/deploy/ssl/setup-ssl.sh ~/ssl-proxy/ 2>/dev/null || true
            rm -rf ~/vione_crm_deploy_temp

            # Load Docker image & Restart Frontend
            cd ~/vione-crm
            docker load -i vione-crm-frontend.tar.gz
            rm -f vione-crm-frontend.tar.gz
            docker compose up -d --force-recreate crm-frontend

            # Reload or recreate Nginx SSL proxy
            cd ~/ssl-proxy
            sed -i 's/\r$//' setup-ssl.sh 2>/dev/null || true
            bash setup-ssl.sh || docker compose -f docker-compose.ssl.yml restart 2>/dev/null || true
            echo "========================================================"
            echo ">>> SUBDOMAIN https://crm.viconnect.vn/ DEPLOYED! <<<"
            echo "========================================================"
