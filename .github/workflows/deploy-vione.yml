name: Auto Deploy PWA to Subdomain (vione.viconnect.vn)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy ViOne (vione.viconnect.vn)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate TanStack Routes
        run: node apps/vione_app_fe/scripts/gen-routes.mjs

      - name: Build Web PWA Frontend
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          export VITE_APP_SCOPE="vione_app"
          export VITE_APP_NAME="ViOne Connect"
          export VITE_PUBLIC_APP_URL="https://vione.viconnect.vn"
          export NEST_API_URL="http://vione-backend:4000"
          npm run build --prefix apps/vione_app_fe

      - name: Build Docker Frontend & Backend Images
        run: |
          docker build --no-cache -t vione-standalone-frontend:latest -t vione-frontend:latest -f deploy/vione/Dockerfile.frontend .
          docker save vione-standalone-frontend:latest | gzip -1 > vione-frontend.tar.gz
          docker build --no-cache -t vione-standalone-backend:latest -t vione-backend:latest -f Dockerfile.backend .
          docker save vione-standalone-backend:latest | gzip -1 > vione-backend.tar.gz

      - name: Prepare Remote Directories via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST || '14.225.217.232' }}
          username: ${{ secrets.REMOTE_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            mkdir -p ~/vione ~/vione-ssl-proxy

      - name: Copy Built Artifacts via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST || '14.225.217.232' }}
          username: ${{ secrets.REMOTE_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "vione-frontend.tar.gz,vione-backend.tar.gz,deploy/vione/docker-compose.yml,deploy/vione/.env.production,deploy/ssl/nginx.conf,deploy/ssl/docker-compose.ssl.yml,deploy/ssl/setup-ssl.sh"
          target: "vione_deploy_temp"

      - name: Activate New Container & Reload Nginx Proxy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST || '14.225.217.232' }}
          username: ${{ secrets.REMOTE_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            # Move frontend and backend images & compose
            cp -f ~/vione_deploy_temp/vione-frontend.tar.gz ~/vione/ 2>/dev/null || true
            cp -f ~/vione_deploy_temp/vione-backend.tar.gz ~/vione/ 2>/dev/null || true
            cp -f ~/vione_deploy_temp/deploy/vione/docker-compose.yml ~/vione/ 2>/dev/null || true
            cp -f ~/vione_deploy_temp/deploy/vione/.env.production ~/vione/.env 2>/dev/null || true
            
            # Move SSL & Nginx config
            cp -f ~/vione_deploy_temp/deploy/ssl/nginx.conf ~/vione-ssl-proxy/ 2>/dev/null || true
            cp -f ~/vione_deploy_temp/deploy/ssl/docker-compose.ssl.yml ~/vione-ssl-proxy/ 2>/dev/null || true
            cp -f ~/vione_deploy_temp/deploy/ssl/setup-ssl.sh ~/vione-ssl-proxy/ 2>/dev/null || true
            rm -rf ~/vione_deploy_temp

            # Load Docker images & Restart Services
            cd ~/vione
            if [ -f vione-frontend.tar.gz ]; then
              docker load -i vione-frontend.tar.gz
              docker tag vione-standalone-frontend:latest vione-frontend:latest 2>/dev/null || true
              rm -f vione-frontend.tar.gz
            fi
            if [ -f vione-backend.tar.gz ]; then
              docker load -i vione-backend.tar.gz
              docker tag vione-standalone-backend:latest vione-backend:latest 2>/dev/null || true
              rm -f vione-backend.tar.gz
            fi
            docker compose up -d --force-recreate frontend backend
            docker compose up -d minio 2>/dev/null || true

            # Reload or recreate Nginx SSL proxy
            cd ~/vione-ssl-proxy
            sed -i 's/\r$//' setup-ssl.sh 2>/dev/null || true
            bash setup-ssl.sh || docker compose -f docker-compose.ssl.yml restart 2>/dev/null || true
            echo "========================================================"
            echo ">>> SUBDOMAIN https://vione.viconnect.vn/ DEPLOYED! <<<"
            echo "========================================================"
